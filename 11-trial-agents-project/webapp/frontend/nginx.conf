# Static app only. /api/* never reaches this container: the load balancer
# routes it to the backend service. Every other path falls back to
# index.html, so a refresh on /c/<id> loads the app and the router takes over.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /index.html { add_header Cache-Control "no-store"; }
  location /assets/     { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /            { try_files $uri /index.html; }
}
