[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-search-a2a-agent"
version = "0.1.0"
description = "trial_search agent (semantic search over the clinical trial Pinecone index) using LangChain with A2A protocol on Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore[a2a]>=1.0.0",
    # a2a-sdk pinned to what bedrock-agentcore[a2a] requires. See
    # trial_graph's own pyproject.toml for the full reasoning — the 1.x
    # line switches to a protobuf message API and breaks main.py's
    # pydantic-based Message/Part/TextPart construction, confirmed by
    # actually installing 1.x and inspecting Message's real type.
    "a2a-sdk>=0.3,<1.0",
    "langchain>=1.3.13",
    "langgraph>=1.2.9",
    "langchain-openai>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "mcp-proxy-for-aws>=0.1.0",
    # Produces the nested LangGraph -> model -> tools span tree. NOTE THE
    # PACKAGE: openINFERENCE — opentelemetry-instrumentation-langchain has a
    # known incompatibility with current LangGraph and emits no spans silently.
    "openinference-instrumentation-langchain",
    # Exports those spans. Provides the `opentelemetry-instrument` command the
    # Dockerfile runs, and the AWS configuration AgentCore Runtime presets.
    "aws-opentelemetry-distro>=0.10.0",
    "pydantic>=2.0",
    "boto3>=1.39.8",
]
