[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-nlq-a2a-agent"
version = "0.1.0"
description = "ecom NLQ agent: natural language to read-only SQL on RDS PostgreSQL, grounded in Pinecone, A2A on Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore[a2a]>=1.0.0",
    "a2a-sdk>=0.3,<1.0",
    "langchain>=1.3.13",
    "langgraph>=1.2.9",
    "langchain-openai>=1.0.0",
    "mcp>=1.0.0",
    "mcp-proxy-for-aws>=0.1.0",
    "openai>=1.40",
    "pinecone>=7.0",
    "openinference-instrumentation-langchain",
    "aws-opentelemetry-distro>=0.10.0",
    "pydantic>=2.0",
    "boto3>=1.39.8",
]

[tool.setuptools]
py-modules = []
