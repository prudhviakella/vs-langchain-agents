[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-supervisor-a2a-agent"
version = "0.1.0"
description = "ecom supervisor: plans, calls NLQ and chart_gen, composes the streamed answer — A2A on Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore[a2a]>=1.0.0",
    "a2a-sdk>=0.3,<1.0",
    "langchain>=1.3.13",
    "langgraph>=1.2.9",
    "langchain-openai>=1.0.0",
    "openai>=1.40",
    "openinference-instrumentation-langchain",
    "aws-opentelemetry-distro>=0.10.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "boto3>=1.39.8",
]

[tool.setuptools]
py-modules = []
